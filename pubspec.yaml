name: dailypulse
description: "Daily Pulse - Track your daily moods and emotions"
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.1.3
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  intl: ^0.20.2
  uuid: ^4.5.3
  connectivity_plus: ^7.0.0
  logger: ^2.7.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  signals_flutter: ^7.1.0
  go_router: ^18.1.1
  inject_annotation: ^1.2.1
  google_sign_in: ^7.2.0
  app_links: ^7.2.2
  url_launcher: ^6.3.3
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_timezone: ^5.1.1
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.2
  inject_generator: ^1.2.1
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/general_ui/
    - assets/mindfull/
    - assets/navigation/
    - assets/super_ego/
    - assets/home/

flutter_native_splash:
  color: "#FAF8F5"
  color_dark: "#161210"
  image: assets/splash_android12.png
  image_dark: assets/splash_android12.png
  android_gravity: center
  ios_content_mode: scaleAspectFit
  android_12:
    color: "#FAF8F5"
    color_dark: "#161210"
    image: assets/splash_android12.png
    image_dark: assets/splash_android12.png
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FAF8F5"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"


