<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DailyPulse</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f3ed;
        color: #3e3a35;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
      }
      p {
        line-height: 1.5;
      }
      a {
        color: #b5654a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DailyPulse</h1>
      <p id="status">Verifying your email…</p>
      <noscript>
        <p>Please enable JavaScript to continue.</p>
      </noscript>
      <p><a id="manual" href="/app-verify">Continue</a></p>
    </main>
    <script>
      (function () {
        var search = window.location.search;
        var mode = new URLSearchParams(search).get('mode');
        var manual = document.getElementById('manual');

        // Only email verification is handled inside the app. Password reset
        // and email-change links stay on Firebase's default web handler.
        if (mode === 'verifyEmail') {
          var target = '/app-verify' + search;
          manual.href = target;
          window.location.replace(target);
          return;
        }

        var defaultHandler =
          'https://dailyplus-mobile-app.firebaseapp.com/__/auth/action' + search;
        manual.href = defaultHandler;
        window.location.replace(defaultHandler);
      })();
    </script>
  </body>
</html>
