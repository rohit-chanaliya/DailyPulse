<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DailyPulse — Verify email</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f3ed;
        color: #3e3a35;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
      }
      p {
        line-height: 1.5;
      }
      a.button {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.8rem 1.4rem;
        border-radius: 999px;
        background: #b5654a;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Verify your email</h1>
      <p>
        If DailyPulse is installed, it will open automatically. If nothing
        happens, tap the button below.
      </p>
      <a class="button" id="open" href="#">Open DailyPulse</a>
      <p><small>Not installed yet? Install DailyPulse, then open this link again.</small></p>
    </main>
    <script>
      (function () {
        // App Links normally intercept this path before the browser loads it.
        // This page is the fallback when verification has not completed yet.
        var search = window.location.search;
        document.getElementById('open').href = 'dailypulse://verify' + search;
      })();
    </script>
  </body>
</html>
